<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__ADDRESS__ · 지도</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f3;color:#192d35;font:14px/1.6 -apple-system,'Malgun Gothic',sans-serif}header,main{max-width:1400px;margin:auto;padding:22px}h1{font-size:26px;letter-spacing:-.04em}.bar{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;min-height:42px;border:1px solid #c5d2ce;border-radius:4px;background:white;color:#192d35;padding:7px 13px;cursor:pointer}button.active{background:#192d35;color:white}button:focus-visible,input:focus-visible{outline:3px solid #2781a8}.atlas{display:grid;grid-template-columns:240px minmax(0,1fr);border:1px solid #ccd8d2;background:white}aside{padding:15px;border-right:1px solid #ccd8d2}label{display:flex;gap:8px;padding:7px 0;font-size:12px}input{accent-color:#285e6a}i{display:inline-block;width:16px;height:4px;margin-top:8px}#viewport{height:580px;position:relative;overflow:hidden}svg{width:100%;height:100%;background:#eef1e9;touch-action:none;cursor:grab;display:block}.tools{position:absolute;right:10px;top:10px;display:flex;gap:4px}.north{position:absolute;top:14px;left:12px;font-weight:bold}.credit{position:absolute;bottom:0;left:0;background:#fffd;padding:4px 9px;font-size:10px}.info,.notes{padding:15px;background:white;border:1px solid #ccd8d2;overflow-wrap:anywhere}.notes{background:#fff1df;margin:16px 0}.small{font-size:11px;color:#677a7b}#three iframe{height:650px;width:100%;border:0}.hidden,[hidden]{display:none!important}select{max-width:100%;padding:7px;margin:12px 0}#info{white-space:pre-wrap}a{color:#236677}@media(max-width:700px){header,main{padding:16px}.atlas{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;border:0;border-bottom:1px solid #ccd8d2}aside h3,aside select,aside p{grid-column:1/-1}#viewport{height:450px}#three iframe{height:560px}}</style></head><body><header><div class="small">SITE SPATIAL ATLAS</div><h1>__ADDRESS__</h1><div class="bar"><button id="twoBtn" class="active" aria-pressed="true">2D 필지·규제도</button><button id="threeBtn" aria-pressed="false">3D 대지 보기</button><a href="report.html" target="_top">전체 보고서 ↗</a></div></header><main><div id="two"><div class="atlas"><aside id="layers"><h3>공간정보 레이어</h3></aside><div id="viewport"><svg id="map" tabindex="0" aria-label="대상지 벡터 지도, 방향키 이동 및 더하기 빼기로 확대 축소"><g id="world"></g></svg><span class="north">↑ N</span><div class="tools"><button id="plus" aria-label="확대">＋</button><button id="minus" aria-label="축소">−</button><button id="home">대상지</button></div><span class="credit">VWorld 공개 도형 · WGS84→Web Mercator · 배경 없는 벡터 참고도 / 측량도 아님</span></div></div><div id="info" class="info" role="status">필지나 규제 도형을 눌러 속성과 출처를 확인하세요.</div></div><div id="three" hidden><button id="load">실제 브이월드 3D 불러오기</button><p id="threeNote" class="small">전용 로컬 서버, 인터넷과 사용자 VWorld 키가 필요합니다. 브라우저 실행 시 인증키가 SDK에 전달됩니다.</p><iframe id="frame" title="브이월드 3D 지도" hidden></iframe></div><div class="notes" id="notes"></div></main><script>
const D=__CASE_DATA__, $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const pxy=p=>[6378137*p[0]*Math.PI/180,-6378137*Math.log(Math.tan(Math.PI/4+p[1]*Math.PI/360))];
function rings(g){return g.type==='Polygon'?g.coordinates:g.type==='MultiPolygon'?g.coordinates.flat():g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[]}
function el(tag,attrs,parent){let e=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}
function shape(f,parent,color,dash=false){let g=f.geometry;if(!g)return;let s;if(g.type==='Point'){let p=pxy(g.coordinates);s=el('circle',{cx:p[0],cy:p[1],r:3,fill:color},parent)}else{s=el('path',{d:rings(g).map(r=>'M'+r.map(p=>pxy(p).join(',')).join('L')+(g.type.includes('Polygon')?'Z':'')).join(''),fill:g.type.includes('Polygon')?color:'none','fill-opacity':'.13',stroke:color,'stroke-width':1.3,'fill-rule':'evenodd','vector-effect':'non-scaling-stroke'},parent);if(dash)s.setAttribute('stroke-dasharray','6 4')}return s}
let all=D.layers.map((x,i)=>({...x,id:'layer'+i}));all.push({id:'site',label:'대상 필지',color:'#c7402c',visible:true,geojson:D.site,source_id:'대상 필지 원자료'});
for(let layer of all){let g=el('g',{id:layer.id},$('world'));g.style.display=layer.visible===false?'none':'';let label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=layer.visible!==false;check.onchange=()=>g.style.display=check.checked?'':'none';let sw=document.createElement('i');sw.style.background=layer.color||'#687d7f';label.append(check,sw,document.createTextNode(layer.label));$('layers').append(label);for(let f of layer.geojson.features){let s=shape(f,g,layer.color||'#687d7f',layer.dash);if(s){s.dataset.layer=layer.label;s.dataset.properties=JSON.stringify(f.properties||{});s.dataset.source=layer.source_id||'출처 상세 확인';if(layer.id==='site')s.setAttribute('stroke-width',3)}}}
let hint=document.createElement('p');hint.className='small';hint.textContent='드래그 이동 · 휠 확대 · 방향키/+/- 지원. 위에 겹친 레이어를 끄면 아래 도형을 선택할 수 있습니다.';$('layers').append(hint);
let points=D.site.features.flatMap(f=>rings(f.geometry).flat()).map(pxy),center=D.center?pxy(D.center):points.length?points[0]:[0,0];
let extent=points.length?Math.max(Math.max(...points.map(p=>p[0]))-Math.min(...points.map(p=>p[0])),Math.max(...points.map(p=>p[1]))-Math.min(...points.map(p=>p[1]))):100;let size=Math.max(extent*3,200),v;function draw(){$('map').setAttribute('viewBox',v.join(' '))}function home(){v=[center[0]-size/2,center[1]-size/2,size,size];draw()}home();function zoom(f){let w=Math.max(30,Math.min(20000,v[2]*f));v=[v[0]+(v[2]-w)/2,v[1]+(v[3]-w)/2,w,w];draw()}
$('home').onclick=home;$('plus').onclick=()=>zoom(.75);$('minus').onclick=()=>zoom(1.333);$('map').onwheel=e=>{e.preventDefault();zoom(e.deltaY>0?1.15:.87)};$('map').onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-'].includes(e.key))e.preventDefault();let step=v[2]/10;if(e.key==='ArrowLeft')v[0]-=step;if(e.key==='ArrowRight')v[0]+=step;if(e.key==='ArrowUp')v[1]-=step;if(e.key==='ArrowDown')v[1]+=step;if(e.key==='+'||e.key==='=')zoom(.8);if(e.key==='-')zoom(1.25);draw()};let drag=null,dist=0,pointers=new Map(),pinch;
$('map').onpointerdown=e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);$('map').setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,v:[...v],target:e.target};dist=0;pinch=null};$('map').onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){let [a,b]=[...pointers.values()],len=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch&&len)zoom(pinch/len);pinch=len;dist=100;return}if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;dist=Math.abs(dx)+Math.abs(dy);let scale=Math.min($('map').clientWidth/drag.v[2],$('map').clientHeight/drag.v[3]);v=[drag.v[0]-dx/scale,drag.v[1]-dy/scale,drag.v[2],drag.v[3]];draw()};$('map').onpointerup=e=>{if(drag&&dist<6&&drag.target.dataset.properties){let t=drag.target;$('info').textContent=t.dataset.layer+' · '+t.dataset.source+'\n'+Object.entries(JSON.parse(t.dataset.properties)).map(([k,v])=>k+': '+v).join(' · ')}pointers.delete(e.pointerId);drag=null;pinch=null};$('map').onpointercancel=()=>{pointers.clear();drag=null;pinch=null};
$('notes').textContent=D.notes.join(' / ')||'건축선·차량출입·규제 적용은 원문과 승인도면 대조가 필요합니다.';if(!D.site.features.length)$('info').textContent='대상 필지 도형 미확보: 원자료를 추가한 뒤 다시 생성하세요. 위치를 추정해 경계를 생성하지 않습니다.';
function tab(three){$('two').hidden=three;$('three').hidden=!three;for(let [id,on] of [['twoBtn',!three],['threeBtn',three]]){$(id).classList.toggle('active',on);$(id).setAttribute('aria-pressed',on)}}$('twoBtn').onclick=()=>tab(false);$('threeBtn').onclick=()=>tab(true);$('load').onclick=()=>{if(location.protocol==='file:'){$('threeNote').textContent='scripts/serve_case.py로 이 케이스를 실행한 뒤 로컬 주소에서 열어주세요.';return}if(!D.center){$('threeNote').textContent='검증한 대상지 중심좌표가 필요합니다.';return}$('frame').src='map/vworld3d.html';$('frame').hidden=false;$('load').hidden=true};
</script></body></html>
