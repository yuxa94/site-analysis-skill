<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__ADDRESS__ · 브이월드 3D</title><style>html,body,#vmap{width:100%;height:100%;margin:0;overflow:hidden}body{font:13px/1.5 -apple-system,'Apple SD Gothic Neo',sans-serif}#vmap{background:#e7eef5}.panel{position:absolute;top:14px;left:14px;z-index:999;background:#ffffffed;padding:12px;border-radius:5px;max-width:310px;box-shadow:0 3px 14px #0002}.panel strong{display:block;margin-bottom:6px}button{padding:7px 10px;background:white;border:1px solid #b8c5c6;border-radius:4px;min-height:38px;cursor:pointer;font:inherit}button:focus-visible{outline:3px solid #159ccc}.buttons{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}label{display:block;margin:5px 0}input{accent-color:#136d85}.small{font-size:11px;color:#525e65}#status{font-size:11px;color:#366772}.bottom{position:absolute;bottom:32px;left:12px;right:70px;max-width:560px;background:#fff1dded;padding:8px 12px;border-left:3px solid #bd7937;z-index:999;font-size:11px}@media(max-width:600px){.panel{top:8px;left:8px;max-width:220px;padding:10px}.panel strong{font-size:12px}.small{font-size:10px}.bottom{font-size:10px;right:60px;bottom:29px}button{padding:6px 8px;font-size:12px}}</style><script src="/vworld-sdk.js"></script></head><body><div id="vmap"></div><div class="panel"><strong>__ADDRESS__ · 브이월드 3D</strong><div id="status" role="status">입체 지도를 불러오는 중입니다.</div><div class="buttons"><button id="focus">대상지로</button><button id="top">위에서</button><button id="reverse">반대 시점</button></div><label><input type="checkbox" id="parcel" checked> 대상 필지 강조</label><label><input type="checkbox" id="mass"> 대장 높이 참고 매스</label><p class="small">드래그: 이동 · 휠: 확대<br>Ctrl + 드래그: 기울이기·회전<br>노란 면: 대상 필지 / 청록: 단순 참고 매스</p></div><div class="bottom">배경 3D의 현황 시점은 별도 확인 대상입니다. 촬영·모델 시점과 현재 대장 사용승인일을 대조하세요. 참고 매스는 현재 건축물의 정확한 형상이 아닙니다.</div><script>
for (const type of ['mousedown','mouseup','pointerdown','pointerup','touchstart','touchend','click']) document.querySelector('.panel').addEventListener(type,e=>e.stopPropagation());
const CASE=__CASE_DATA__;const CENTER=CASE.center;let viewer,parcelDs,massDs,ready=false;const statusEl=document.getElementById('status');function focusSite(mode='front'){if(!viewer)return;let heading=mode==='back'?Math.PI:0,pitch=mode==='top'?-Math.PI/2:-.65,range=mode==='top'?280:350;viewer.camera.lookAt(Cesium.Cartesian3.fromDegrees(CENTER[0],CENTER[1],40),new Cesium.HeadingPitchRange(heading,pitch,range));viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY)}
document.getElementById('focus').onclick=()=>focusSite();document.getElementById('top').onclick=()=>focusSite('top');document.getElementById('reverse').onclick=()=>focusSite('back');document.getElementById('parcel').onchange=e=>{if(parcelDs)parcelDs.show=e.target.checked};document.getElementById('mass').onchange=e=>{if(massDs)massDs.show=e.target.checked};
document.getElementById('mass').disabled=!(CASE.reference_height_m>0&&CASE.reference_building.features.length);try{if(!CENTER)throw Error('대상지 좌표 미확인');if(!window.vw)throw Error('전용 로컬 서버와 API 연결을 확인하세요.');var map=new vw.Map();map.setOption({mapId:'vmap',logo:true,navigation:true});map.setMapId('vmap');map.setInitPosition(new vw.CameraPosition(new vw.CoordZ(CENTER[0],CENTER[1]-.004,450),new vw.Direction(0,-40,0)));vw.ws3dInitCallBack=function(){viewer=ws3d.viewer;ready=true;statusEl.textContent='브이월드 3D 연결됨 · 경계를 준비합니다';Promise.resolve(CASE.site).then(d=>Cesium.GeoJsonDataSource.load(d,{stroke:Cesium.Color.ORANGERED,fill:Cesium.Color.YELLOW.withAlpha(.32),strokeWidth:5,clampToGround:true})).then(ds=>{parcelDs=ds;viewer.dataSources.add(ds);focusSite();setTimeout(()=>focusSite(),3500);statusEl.textContent='연결 완료 · 대상 필지 강조';}).catch(()=>{statusEl.textContent='3D 연결됨 · 필지 도형 로딩 실패'});Promise.resolve(CASE.reference_building).then(d=>Cesium.GeoJsonDataSource.load(d,{fill:Cesium.Color.CYAN.withAlpha(.65),stroke:Cesium.Color.TEAL,strokeWidth:2})).then(ds=>{massDs=ds;ds.entities.values.forEach(e=>{if(e.polygon){e.polygon.height=0;e.polygon.heightReference=Cesium.HeightReference.CLAMP_TO_GROUND;e.polygon.extrudedHeight=CASE.reference_height_m||0;e.polygon.extrudedHeightReference=Cesium.HeightReference.RELATIVE_TO_GROUND;e.polygon.material=Cesium.Color.fromCssColorString('#38c0c3').withAlpha(.72)}});ds.show=false;viewer.dataSources.add(ds)}).catch(()=>{document.getElementById('mass').disabled=true})};map.start();setTimeout(()=>{if(!ready)statusEl.textContent='로딩 지연 · 인터넷/API 도메인 설정 또는 WebGL 지원을 확인하세요.'},25000)}catch(e){statusEl.textContent='3D 초기화 실패 · '+e.message}
</script></body></html>
